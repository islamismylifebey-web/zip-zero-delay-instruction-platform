name: ZIP CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zip-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run test:zip
      - run: npm test
      - run: node scripts/typecheck.mjs
      - run: npm run lint
      - name: Verify Vercel frontend-only build
        env:
          NEXT_PUBLIC_ZIP_API_ORIGIN: https://zip-api.example.com
        run: npm run build:vercel
