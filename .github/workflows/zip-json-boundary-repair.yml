name: ZIP one-time JSON boundary repair
on:
  push:
    branches: [fix/zip-phase1-completion]
    paths: [.github/workflows/zip-json-boundary-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'islamismylifebey-web/zip-zero-delay-instruction-platform' && github.ref == 'refs/heads/fix/zip-phase1-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Apply only the two reviewed response type annotations
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fea6954af87b91b3e6128ba3b517594289108929"
          python3 - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          fixes = [
              ('app/workforce-app.tsx', '24817e44afc8c4ba8e48db2417d383400311bb4c',
               'response.ok ? response.json() : Promise.reject(new Error("Sync failed"))',
               'response.ok ? response.json() as Promise<{ workspace: { company?: CompanyProfile; jobs?: Job[]; crew?: CrewMember[]; mileage?: MileageEntry[] } | null; updatedAt?: string }> : Promise.reject(new Error("Sync failed"))'),
              ('app/zip-chat.tsx', '49e3ef6fe4e84ee43eff5a3d7913de1d39f4c628',
               "response.ok ? response.json() : Promise.reject(new Error('workspace'))",
               "response.ok ? response.json() as Promise<{ workspace?: { crew?: CrewMember[] }; viewer: WorkspaceViewer }> : Promise.reject(new Error('workspace'))"),
          ]
          for filename, expected, before, after in fixes:
              assert check_output(['git', 'hash-object', filename], text=True).strip() == expected, 'Source changed; refusing repair'
              path = Path(filename)
              source = path.read_text()
              assert source.count(before) == 1, 'Expected one exact replacement'
              path.write_text(source.replace(before, after))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/workforce-app.tsx app/zip-chat.tsx
          git commit -m 'fix: type workspace JSON at browser response boundaries'
          git push origin HEAD:refs/heads/fix/zip-phase1-completion
